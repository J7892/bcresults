name: Update BC Election Results

on:
  schedule:
    # Run every 10 minutes throughout election night
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      results_url:
        description: 'Optional custom results feed URL'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: election-updates
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests shapely

      - name: Update Election Results
        env:
          RESULTS_URL: ${{ inputs.results_url }}
        run: |
          python scripts/update_results.py

      - name: Commit and Push if Results Changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for changes in data/results.json
          if ! git diff --quiet data/results.json; then
            echo "New election results detected. Committing..."
            git add data/results.json
            git commit -m "chore(data): auto-update BC election results [skip ci]"
            git push origin main
          else
            echo "No changes in election results."
          fi
